# Builds the site and publishes it to GitHub Pages every time something is
# saved to the main branch (including saves from Pages CMS).
name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Republish after the weekly publication update has saved new papers.
  workflow_run:
    workflows: ["Update publications"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # base_path is empty on a custom domain, or "/<repo-name>" before one is set.
      - run: npx @11ty/eleventy --pathprefix="${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
