# Rebuilds the Research Atlas (atlas/atlas.html) on the 1st of every month,
# or whenever you press "Run workflow" in the Actions tab. When the atlas
# changed, it is saved to the repository, which republishes the website.
name: Update atlas

on:
  schedule:
    - cron: "23 3 1 * *"   # 03:23 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: atlas/requirements.txt

      - name: Install packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r atlas/requirements.txt

      - name: Keep the embedding model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-all-MiniLM-L6-v2

      - name: Build the atlas
        run: python atlas/build.py
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

      - name: Save the new atlas
        run: |
          for f in atlas/atlas.html atlas/pubmed_abstracts.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Atlas unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Research Atlas"
          git pull --rebase
          git push
